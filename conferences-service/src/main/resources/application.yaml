server:
  port: 8080
  http2:
    enabled: true
  shutdown: graceful

spring:
  application:
    name: conferences
  profiles:
    include:
  flyway:
    enabled: true
  datasource:
    url: jdbc:postgresql://${DB_URL}:${DB_PORT}/conferences
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      minimum-idle: 1
      maximum-pool-size: 10
      connection-test-query: SELECT 1
      pool-name: conferences-db-cp
  jpa:
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        jdbc:
          batch_size: 20
          use_streams_for_binary: true
      open-in-view: false

springdoc:
  api-docs:
    enabled: true
    path: /${spring.application.name}/v3/api-docs
    version: openapi_3_1
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    path: /${spring.application.name}/swagger-ui
    config-url: /${spring.application.name}/v3/api-docs/swagger-config
    url: /${spring.application.name}/v3/api-docs
  show-actuator: false

management:
  endpoints:
    enabled-by-default: false

debug: false